# Deploy to Firebase Hosting when a commit lands on main.
# Vite replaces import.meta.env.VITE_API_URL at build time, so the
# production Render URL must be injected here — without it the built
# bundle falls back to http://localhost:8000 and every API call fails.

name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: https://autopost-c54s.onrender.com
        run: npm run build

      - name: Deploy to Firebase Hosting (live channel)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUTOPOST_9C37C }}
          channelId: live
          projectId: autopost-9c37c
